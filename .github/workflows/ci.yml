name: CI

on:
  push:
    branches-ignore: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Build
      run: ./gradlew

    - name: Test
      run: ./gradlew test

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: build/libs/*
